name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit + integration tests
        # Enforcement tests self-skip when the runner lacks a tier; the
        # GitHub-hosted ubuntu kernel normally provides both landlock and
        # unprivileged userns.
        run: cargo test --all-features --quiet

      - name: Release build
        run: cargo build --release --all-features

  check-aarch64:
    name: compile + syscall ABI tests (aarch64 via QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Register binfmt_misc so the aarch64 test binary executes under QEMU.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      # Compile the complete test suite for ARM64, then execute the pure BPF
      # syscall/architecture tests under QEMU. Full filesystem and /proc tests
      # run natively in the Ubuntu job: qemu-user does not preserve every
      # openat/procfs behavior those enforcement tests intentionally inspect.
      - name: Compile complete test suite (aarch64)
        run: cross test --target aarch64-unknown-linux-gnu --all-features --no-run

      - name: Execute syscall ABI tests (aarch64 via QEMU)
        run: >-
          cross test --target aarch64-unknown-linux-gnu --all-features --lib
          sandbox::linux::seccomp_netblock::tests --quiet

  build-macos:
    name: build + test (macOS arm64 and x86_64 check)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --all-features
      - run: cargo test --all-features --quiet
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Intel macOS cross-check
        run: cargo check --target x86_64-apple-darwin --all-features

  build-windows:
    name: build + test (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --all-features
      - run: cargo test --all-features --quiet
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Temporary PR-only helper while the user's Codespaces account is blocked
  # by GitHub billing. It produces mechanical rustfmt/Cargo.lock output for
  # review; the job is removed before merge.
  maintenance-artifact:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/rescue-feedback-gaps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: rescue-feedback-mechanical-output
          path: |
            Cargo.lock
            src/rescue/codex.rs
            src/rescue/codex_inventory.rs
            src/rescue/claude.rs
            src/rescue/types.rs
            tests/integration/rescue.rs
