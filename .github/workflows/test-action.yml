name: test-action

on:
  push:
    paths:
      - 'action.yml'
      - '.github/workflows/test-action.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-setup-vetto:
    name: setup-vetto (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vetto (Action test)
        id: vetto
        uses: ./
        with:
          version: '0.2.12'

      - name: Verify vetto CLI
        shell: bash
        run: |
          vetto --version
          vetto doctor --dry-run || true
