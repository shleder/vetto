<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap");
      .term-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .header-bar { fill: #161b22; }
      .btn-red { fill: #ff5f56; }
      .btn-yellow { fill: #ffbd2e; }
      .btn-green { fill: #27c93f; }
      .title { fill: #8b949e; font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 600; }
      
      .text { font-family: "JetBrains Mono", monospace; font-size: 13px; line-height: 20px; }
      .prompt { fill: #58a6ff; font-weight: 600; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .info { fill: #7ee787; }
      .agent { fill: #d2a8ff; font-weight: 600; }
      .block { fill: #ff7b72; font-weight: 700; }
      .redact { fill: #e3b341; font-weight: 700; }
      .dim { fill: #8b949e; }
      .success { fill: #3fb950; font-weight: 700; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .line-1 { animation: fadeIn 0.4s ease-out forwards; animation-delay: 0.2s; opacity: 0; }
      .line-2 { animation: fadeIn 0.4s ease-out forwards; animation-delay: 1.0s; opacity: 0; }
      .line-3 { animation: fadeIn 0.4s ease-out forwards; animation-delay: 1.8s; opacity: 0; }
      .line-4 { animation: fadeIn 0.4s ease-out forwards; animation-delay: 2.6s; opacity: 0; }
      .line-5 { animation: fadeIn 0.4s ease-out forwards; animation-delay: 3.4s; opacity: 0; }
      .line-6 { animation: fadeIn 0.4s ease-out forwards; animation-delay: 4.2s; opacity: 0; }
      .line-7 { animation: fadeIn 0.4s ease-out forwards; animation-delay: 5.0s; opacity: 0; }
      .line-8 { animation: fadeIn 0.4s ease-out forwards; animation-delay: 5.8s; opacity: 0; }
      .line-9 { animation: fadeIn 0.4s ease-out forwards; animation-delay: 6.6s; opacity: 0; }
      .line-10 { animation: fadeIn 0.4s ease-out forwards; animation-delay: 7.4s; opacity: 0; }
    </style>
  </defs>

  <!-- Terminal Window -->
  <rect x="10" y="10" width="860" height="420" class="term-bg" />
  
  <!-- Header Bar -->
  <path d="M 10 22 C 10 15.37 15.37 10 22 10 L 858 10 C 864.63 10 870 15.37 870 22 L 870 46 L 10 46 Z" class="header-bar" />
  <circle cx="34" cy="28" r="6" class="btn-red" />
  <circle cx="54" cy="28" r="6" class="btn-yellow" />
  <circle cx="74" cy="28" r="6" class="btn-green" />
  <text x="440" y="32" text-anchor="middle" class="title">vetto sandbox — codex-runtime (Landlock ABI v5 + PTY Stream)</text>

  <!-- Terminal Content Lines -->
  <g transform="translate(30, 80)" class="text">
    <g class="line-1">
      <text x="0" y="0"><tspan class="prompt">$ </tspan><tspan class="cmd">vetto --profile strict -- codex exec &quot;inspect secrets and deploy&quot;</tspan></text>
    </g>

    <g class="line-2" transform="translate(0, 28)">
      <text x="0" y="0"><tspan class="info">[vetto] </tspan><tspan class="dim">OS sandbox established: Landlock ABI v5, Seccomp-BPF, UserNS </tspan><tspan class="info">(0.8ms)</tspan></text>
    </g>

    <g class="line-3" transform="translate(0, 56)">
      <text x="0" y="0"><tspan class="agent">[agent] </tspan><tspan class="dim">Running probe: </tspan><tspan class="cmd">cat ~/.ssh/id_rsa ~/.aws/credentials</tspan></text>
    </g>

    <g class="line-4" transform="translate(0, 84)">
      <text x="0" y="0"><tspan class="info">[vetto] </tspan><tspan class="block">[BLOCKED] </tspan><tspan class="dim">VFS Masking: </tspan><tspan class="cmd">~/.ssh/id_rsa</tspan><tspan class="dim"> mapped to </tspan><tspan class="info">/dev/null</tspan><tspan class="dim"> (0 bytes returned)</tspan></text>
    </g>

    <g class="line-5" transform="translate(0, 112)">
      <text x="0" y="0"><tspan class="agent">[agent] </tspan><tspan class="dim">Probing cloud metadata: </tspan><tspan class="cmd">curl -s http://169.254.169.254/latest/meta-data/</tspan></text>
    </g>

    <g class="line-6" transform="translate(0, 140)">
      <text x="0" y="0"><tspan class="info">[vetto] </tspan><tspan class="block">[BLOCKED] </tspan><tspan class="dim">Network Deny: Target </tspan><tspan class="cmd">169.254.169.254:80</tspan><tspan class="block"> [EPERM: Network unreachable]</tspan></text>
    </g>

    <g class="line-7" transform="translate(0, 168)">
      <text x="0" y="0"><tspan class="agent">[agent] </tspan><tspan class="dim">Dumping runtime env: </tspan><tspan class="cmd">OPENAI_API_KEY=sk-proj-9A8f7B2... ghp_9381kLz...</tspan></text>
    </g>

    <g class="line-8" transform="translate(0, 196)">
      <text x="0" y="0"><tspan class="info">[vetto] </tspan><tspan class="redact">[PTY REDACT] </tspan><tspan class="dim">Shannon entropy filter scrubbed 2 secret tokens -&gt; </tspan><tspan class="redact">[REDACTED]</tspan></text>
    </g>

    <g class="line-9" transform="translate(0, 236)">
      <text x="0" y="0"><tspan class="success">✓ Operator boundary held: </tspan><tspan class="dim">0 leaks, 0 disk bloat, 0 unconfined subprocesses.</tspan></text>
    </g>

    <g class="line-10" transform="translate(0, 268)">
      <text x="0" y="0"><tspan class="prompt">$ </tspan><tspan class="info">npx @shledery/vetto doctor</tspan><tspan class="dim">  # run anywhere in 1 second</tspan></text>
    </g>
  </g>
</svg>