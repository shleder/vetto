<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="100%" height="100%">
  <defs>
    <style>
      .term-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 10px; }
      .header-bar { fill: #161b22; }
      .btn-red { fill: #ff5f56; }
      .btn-yellow { fill: #ffbd2e; }
      .btn-green { fill: #27c93f; }
      .title { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
      
      .code-line { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13.5px; }
      .prompt { fill: #58a6ff; font-weight: 700; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .info { fill: #7ee787; font-weight: 600; }
      .agent { fill: #d2a8ff; font-weight: 600; }
      .block { fill: #ff7b72; font-weight: 700; }
      .redact { fill: #e3b341; font-weight: 700; }
      .dim { fill: #8b949e; }
      .success { fill: #3fb950; font-weight: 700; }
      .divider { stroke: #21262d; stroke-width: 1; }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect x="5" y="5" width="910" height="480" class="term-bg" />
  
  <!-- Header Bar -->
  <path d="M 5 15 C 5 9.47 9.47 5 15 5 L 905 5 C 910.53 5 915 9.47 915 15 L 915 42 L 5 42 Z" class="header-bar" />
  <circle cx="28" cy="23" r="5.5" class="btn-red" />
  <circle cx="46" cy="23" r="5.5" class="btn-yellow" />
  <circle cx="64" cy="23" r="5.5" class="btn-green" />
  <text x="460" y="28" text-anchor="middle" class="title">vetto sandbox — active process isolation (Landlock ABI v5 + PTY Stream)</text>

  <!-- Content Lines (each line is a single <text> with automatic flow) -->
  <g class="code-line">
    <!-- Line 1: User Invocation -->
    <text x="30" y="80">
      <tspan class="prompt">$ </tspan><tspan class="cmd">vetto --profile strict -- codex exec &quot;inspect credentials &amp; deploy&quot;</tspan>
    </text>

    <!-- Line 2: Sandbox Initialized -->
    <text x="30" y="118">
      <tspan class="info">[vetto] </tspan><tspan class="dim">OS sandbox applied: Landlock ABI v5, Seccomp-BPF, UserNS </tspan><tspan class="info">(0.8ms)</tspan>
    </text>

    <!-- Line 3: Agent Probe File -->
    <text x="30" y="158">
      <tspan class="agent">[agent] </tspan><tspan class="dim">Reading credentials: </tspan><tspan class="cmd">cat ~/.ssh/id_rsa ~/.aws/credentials</tspan>
    </text>

    <!-- Line 4: VFS Interception -->
    <text x="30" y="196">
      <tspan class="info">[vetto] </tspan><tspan class="block">[BLOCKED] </tspan><tspan class="dim">VFS Mask: </tspan><tspan class="cmd">~/.ssh/id_rsa</tspan><tspan class="dim"> mapped to </tspan><tspan class="info">/dev/null</tspan><tspan class="dim"> (0 bytes returned)</tspan>
    </text>

    <!-- Line 5: Agent Probe Metadata -->
    <text x="30" y="236">
      <tspan class="agent">[agent] </tspan><tspan class="dim">Probing AWS metadata: </tspan><tspan class="cmd">curl -s http://169.254.169.254/latest/meta-data/</tspan>
    </text>

    <!-- Line 6: Network Interception -->
    <text x="30" y="274">
      <tspan class="info">[vetto] </tspan><tspan class="block">[BLOCKED] </tspan><tspan class="dim">Net Deny: </tspan><tspan class="cmd">169.254.169.254:80</tspan><tspan class="block"> [EPERM: Network unreachable]</tspan>
    </text>

    <!-- Line 7: Agent Output Stream -->
    <text x="30" y="314">
      <tspan class="agent">[agent] </tspan><tspan class="dim">Dumping tokens: </tspan><tspan class="cmd">OPENAI_API_KEY=sk-proj-9A8f7B2... ghp_9381kLz...</tspan>
    </text>

    <!-- Line 8: PTY Stream Redaction -->
    <text x="30" y="352">
      <tspan class="info">[vetto] </tspan><tspan class="redact">[PTY REDACT] </tspan><tspan class="dim">Entropy filter scrubbed 2 secret tokens -&gt; </tspan><tspan class="redact">[REDACTED]</tspan>
    </text>

    <!-- Divider -->
    <line x1="30" y1="388" x2="890" y2="388" class="divider" />

    <!-- Line 9: Operator Summary Result -->
    <text x="30" y="422">
      <tspan class="success">✓ Operator boundary held: </tspan><tspan class="dim">0 leaks, 0 disk bloat, 0 unconfined child processes.</tspan>
    </text>

    <!-- Line 10: Quick Command -->
    <text x="30" y="458">
      <tspan class="prompt">$ </tspan><tspan class="info">npx @shledery/vetto doctor</tspan><tspan class="dim">  # run anywhere in 1 second</tspan>
    </text>
  </g>
</svg>