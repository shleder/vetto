<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="title desc">
  <title id="title">Capability first</title>
  <desc id="desc">Linux, macOS, and Windows expose different verified boundaries, so vetto probes before launch.</desc>
  <rect width="1200" height="130" fill="#f4f1e8"/>
  <rect x="1" y="1" width="1198" height="128" fill="none" stroke="#171717"/>
  <rect width="112" height="130" fill="#ff4d3d"/>
  <text x="56" y="87" text-anchor="middle" fill="#171717" font-size="62" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">02</text>
  <text x="150" y="40" fill="#6f6b63" font-size="17" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PLATFORM CONTRACT</text>
  <text x="150" y="91" fill="#171717" font-size="48" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">CAPABILITY FIRST</text>
  <g transform="translate(680 39)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <rect width="104" height="52" fill="#171717"/><text x="52" y="33" text-anchor="middle" fill="#f4f1e8">LINUX</text>
    <rect x="116" width="104" height="52" fill="#f4f1e8" stroke="#171717"/><text x="168" y="33" text-anchor="middle" fill="#171717">MACOS</text>
    <rect x="232" width="140" height="52" fill="#f4f1e8" stroke="#171717"/><text x="302" y="33" text-anchor="middle" fill="#171717">WINDOWS*</text>
    <text x="394" y="33" fill="#ff4d3d" font-weight="700">OR STOP</text>
  </g>
</svg>
