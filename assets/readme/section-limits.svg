<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="title desc">
  <title id="title">Know the gaps</title>
  <desc id="desc">Documented limits and fail-closed behavior are part of the vetto security contract.</desc>
  <rect width="1200" height="130" fill="#171717"/>
  <rect x="1" y="1" width="1198" height="128" fill="none" stroke="#f4f1e8"/>
  <rect width="112" height="130" fill="#ff4d3d"/>
  <text x="56" y="87" text-anchor="middle" fill="#171717" font-size="62" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">03</text>
  <text x="150" y="40" fill="#aaa69d" font-size="17" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SECURITY CONTRACT</text>
  <text x="150" y="91" fill="#f4f1e8" font-size="48" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">KNOW THE GAPS</text>
  <g transform="translate(690 42)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
    <text x="0" y="29" fill="#f4f1e8">DOCUMENTED</text><rect x="155" y="13" width="7" height="7" fill="#ff4d3d"/>
    <text x="188" y="29" fill="#f4f1e8">TESTED</text><rect x="285" y="13" width="7" height="7" fill="#ff4d3d"/>
    <text x="318" y="29" fill="#f4f1e8">FAIL-CLOSED</text>
  </g>
