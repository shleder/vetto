<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">vetto enforcement path</title>
  <desc id="desc">Policy is resolved, host capabilities are probed, an operating-system boundary is applied, and only then is the agent executed. Observation and reports remain separate from enforcement.</desc>

  <rect width="1200" height="500" fill="#f4f1e8"/>
  <rect x="1" y="1" width="1198" height="498" fill="none" stroke="#171717"/>
  <path d="M40 62H1160M40 352H1160" stroke="#171717"/>

  <g id="heading">
    <text x="48" y="38" fill="#171717" font-size="18" font-weight="700" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ENFORCEMENT PATH / REAL STARTUP ORDER</text>
    <text x="1152" y="38" text-anchor="end" fill="#6f6b63" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NO BOUNDARY → NO PROCESS</text>
  </g>

  <g id="startup" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="48" y="92" width="220" height="108" fill="#f4f1e8" stroke="#171717" stroke-width="2"/>
    <text x="68" y="120" fill="#6f6b63" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">01 / INPUT</text>
    <text x="68" y="154" fill="#171717" font-size="24" font-weight="750">Resolve policy</text>
    <text x="68" y="181" fill="#6f6b63" font-size="18">base + project + CLI</text>

    <path d="M278 146H308" stroke="#171717" stroke-width="2"/>
    <path d="M300 138L308 146L300 154" fill="none" stroke="#171717" stroke-width="2"/>

    <rect x="318" y="92" width="220" height="108" fill="#f4f1e8" stroke="#171717" stroke-width="2"/>
    <text x="338" y="120" fill="#6f6b63" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">02 / PREFLIGHT</text>
    <text x="338" y="154" fill="#171717" font-size="24" font-weight="750">Probe the host</text>
    <text x="338" y="181" fill="#6f6b63" font-size="18">select or refuse a tier</text>

    <path d="M548 146H578" stroke="#171717" stroke-width="2"/>
    <path d="M570 138L578 146L570 154" fill="none" stroke="#171717" stroke-width="2"/>

    <rect x="588" y="92" width="250" height="108" fill="#171717" stroke="#171717" stroke-width="2"/>
    <text x="608" y="120" fill="#aaa69d" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">03 / GATE</text>
    <text x="608" y="154" fill="#f4f1e8" font-size="24" font-weight="750">Install boundary</text>
    <text x="608" y="181" fill="#ff6a5c" font-size="18" font-weight="700">failure stops here</text>

    <path d="M848 146H878" stroke="#171717" stroke-width="2"/>
    <path d="M870 138L878 146L870 154" fill="none" stroke="#171717" stroke-width="2"/>

    <rect x="888" y="92" width="264" height="108" fill="#f4f1e8" stroke="#171717" stroke-width="2"/>
    <text x="908" y="120" fill="#6f6b63" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">04 / EXEC</text>
    <text x="908" y="154" fill="#171717" font-size="24" font-weight="750">Agent + descendants</text>
    <text x="908" y="181" fill="#6f6b63" font-size="18">policy is inherited</text>
  </g>

  <g id="platform-tiers" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <path d="M713 200V224M176 224H1016M176 224V238M446 224V238M716 224V238M1016 224V238" stroke="#171717"/>

    <rect x="48" y="238" width="256" height="78" fill="#f4f1e8" stroke="#171717"/>
    <text x="68" y="267" fill="#171717" font-size="20" font-weight="700">LINUX FULL</text>
    <text x="68" y="294" fill="#6f6b63" font-size="17">Landlock · ns · seccomp</text>

    <rect x="318" y="238" width="256" height="78" fill="#f4f1e8" stroke="#171717"/>
    <text x="338" y="267" fill="#171717" font-size="20" font-weight="700">LINUX FS-ONLY</text>
    <text x="338" y="294" fill="#6f6b63" font-size="17">Landlock · seccomp</text>

    <rect x="588" y="238" width="256" height="78" fill="#f4f1e8" stroke="#171717"/>
    <text x="608" y="267" fill="#171717" font-size="20" font-weight="700">MACOS</text>
    <text x="608" y="294" fill="#6f6b63" font-size="17">Seatbelt · net off</text>

    <rect x="858" y="238" width="294" height="78" fill="#f4f1e8" stroke="#171717"/>
    <text x="878" y="267" fill="#171717" font-size="20" font-weight="700">WINDOWS*</text>
    <text x="878" y="294" fill="#6f6b63" font-size="17">capability-gated sandbox</text>
  </g>

  <g id="observation" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="40" y="348" width="1120" height="8" fill="#ff4d3d"/>
    <text x="48" y="389" fill="#171717" font-size="18" font-weight="700" letter-spacing="1.5">OBSERVATION / ONE-WAY EVIDENCE</text>
    <text x="1152" y="389" text-anchor="end" fill="#ff4d3d" font-size="18" font-weight="700">NEVER DECIDES ALLOW / DENY</text>

    <rect x="48" y="410" width="210" height="54" fill="#e7e2d8" stroke="#171717"/>
    <text x="153" y="444" text-anchor="middle" fill="#171717" font-size="19">STATUSLINE / TUI</text>
    <rect x="278" y="410" width="210" height="54" fill="#e7e2d8" stroke="#171717"/>
    <text x="383" y="444" text-anchor="middle" fill="#171717" font-size="19">EVENT FEEDS</text>
    <rect x="508" y="410" width="210" height="54" fill="#e7e2d8" stroke="#171717"/>
    <text x="613" y="444" text-anchor="middle" fill="#171717" font-size="19">JSONL</text>
    <rect x="738" y="410" width="414" height="54" fill="#e7e2d8" stroke="#171717"/>
    <text x="945" y="444" text-anchor="middle" fill="#171717" font-size="19">HTML · MD · JSON · SARIF</text>
  </g>
</svg>
