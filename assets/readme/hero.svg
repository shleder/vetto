<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" role="img" aria-label="vetto: a kernel wall between the AI agent and your machine">
  <defs>
    <linearGradient id="vbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>
    <linearGradient id="vwall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#12161d"/>
    </linearGradient>
    <linearGradient id="vdeny" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d1418" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#241014" stop-opacity="0.65"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .title { fill: #f0f6fc; font-size: 44px; font-weight: 700; letter-spacing: -1px; }
    .tag { fill: #8b949e; font-size: 17px; }
    .tline { font-size: 13.5px; }
    .p1 { fill: #58a6ff; font-weight: 700; }
    .p2 { fill: #e3b341; font-weight: 700; }
    .cmd { fill: #f0f6fc; font-weight: 600; }
    .dim { fill: #8b949e; }
    .bad { fill: #ff7b72; font-weight: 600; }
    .blk { fill: #f0883e; font-weight: 700; }
    .ok { fill: #3fb950; font-weight: 600; }
    .walllab { fill: #6e7681; font-size: 11px; letter-spacing: 2px; }
  </style>

  <rect x="0" y="0" width="880" height="320" rx="12" fill="url(#vbg)"/>
  <rect x="0.5" y="0.5" width="879" height="319" rx="12" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- Left: identity -->
  <text x="48" y="96" class="mono title">vetto</text>
  <text x="48" y="128" class="mono tag">kernel wall between the agent</text>
  <text x="48" y="152" class="mono tag">and your machine</text>
  <text x="48" y="196" class="mono tline dim">no root · no daemons · fail-closed</text>
  <text x="48" y="220" class="mono tline dim">exit 125 on breach — never silent</text>
  <text x="48" y="264" class="mono tline"><tspan class="dim">$ </tspan><tspan class="cmd">vetto enable claude</tspan><tspan class="dim">  →  </tspan><tspan class="ok">sandboxed</tspan></text>

  <!-- Middle: the wall -->
  <rect x="400" y="24" width="10" height="272" rx="5" fill="url(#vwall)" stroke="#30363d" stroke-width="1"/>
  <text x="342" y="170" class="mono walllab" transform="rotate(-90 342 170)">LANDLOCK · SECCOMP · NAMESPACES</text>

  <!-- Right: terminal proof -->
  <rect x="440" y="24" width="392" height="272" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <circle cx="464" cy="48" r="6" fill="#ff5f57"/>
  <circle cx="484" cy="48" r="6" fill="#febc2e"/>
  <circle cx="504" cy="48" r="6" fill="#28c840"/>
  <text x="528" y="53" class="mono tline dim">agent session — confined</text>
  <line x1="440" y1="66" x2="832" y2="66" stroke="#21262d" stroke-width="1"/>

  <text x="460" y="100" class="mono tline"><tspan class="p2">agent&gt; </tspan><tspan class="dim">read </tspan><tspan class="bad">~/.ssh/id_rsa</tspan></text>
  <rect x="460" y="112" width="352" height="30" rx="6" fill="url(#vdeny)"/>
  <text x="472" y="132" class="mono tline blk">BLOCKED · secret mask (EACCES)</text>

  <text x="460" y="170" class="mono tline"><tspan class="p2">agent&gt; </tspan><tspan class="dim">open raw socket</tspan></text>
  <rect x="460" y="182" width="352" height="30" rx="6" fill="url(#vdeny)"/>
  <text x="472" y="202" class="mono tline blk">BLOCKED · net namespace</text>

  <text x="460" y="250" class="mono tline"><tspan class="p1">$ </tspan><tspan class="cmd">vetto audit --latest</tspan></text>
  <text x="460" y="274" class="mono tline dim">3 denials · 0 leaks · exit 125 ready</text>
</svg>
