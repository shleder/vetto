<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="vetto — daemon-less sandbox and security layer for AI coding agents">
  <rect width="1200" height="380" fill="#0d1117"/>
  <!-- faint scanlines -->
  <g opacity="0.05" fill="#ffffff">
    <rect x="0" y="40" width="1200" height="1"/>
    <rect x="0" y="90" width="1200" height="1"/>
    <rect x="0" y="140" width="1200" height="1"/>
    <rect x="0" y="190" width="1200" height="1"/>
    <rect x="0" y="240" width="1200" height="1"/>
    <rect x="0" y="290" width="1200" height="1"/>
  </g>
  <!-- terminal dots -->
  <circle cx="30" cy="28" r="7" fill="#ff5f57"/>
  <circle cx="52" cy="28" r="7" fill="#febc2e"/>
  <circle cx="74" cy="28" r="7" fill="#28c840"/>
  <text x="600" y="35" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="15" fill="#484f58">vetto session — tier=full net=off</text>

  <!-- giant wordmark -->
  <text x="64" y="212" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="158" font-weight="700" fill="#ffffff" letter-spacing="8">vetto</text>

  <!-- tagline -->
  <text x="68" y="258" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="21" fill="#8b949e">from “veto” — to forbid · daemon-less sandbox + security layer for AI coding agents</text>

  <!-- VETO stamp -->
  <g transform="rotate(-11 980 150)">
    <rect x="872" y="98" width="230" height="104" rx="10" fill="none" stroke="#f85149" stroke-width="7"/>
    <text x="987" y="167" text-anchor="middle" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="48" font-weight="800" fill="#f85149" letter-spacing="10">VETO</text>
  </g>

  <!-- kernels doing the enforcing -->
  <text x="872" y="228" text-anchor="end" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="16" fill="#4dd0e1">Landlock · namespaces · seccomp · Seatbelt</text>

  <!-- statusline mock -->
  <rect x="0" y="330" width="1200" height="50" fill="#161b22"/>
  <rect x="0" y="330" width="1200" height="1" fill="#30363d"/>
  <text x="14" y="361" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace" font-size="17" fill="#e6edf3">
    <tspan fill="#ffffff" font-weight="700"> vetto </tspan>
    <tspan fill="#3fb950">[tier=full]</tspan>
    <tspan fill="#e6edf3"> </tspan>
    <tspan fill="#3fb950">[net=off]</tspan>
    <tspan fill="#e6edf3"> blocked=</tspan><tspan fill="#f85149" font-weight="700">4</tspan><tspan fill="#e6edf3"> files=132 exec=18 | </tspan>
    <tspan fill="#f85149">09:41 BLOCKED cat → ~/.ssh/id_rsa</tspan>
  </text>
</svg>
