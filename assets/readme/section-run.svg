<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="title desc">
  <title id="title">Run vetto</title>
  <desc id="desc">Install from source, inspect host capabilities, and wrap the existing agent command.</desc>
  <rect width="1200" height="130" fill="#f4f1e8"/>
  <rect x="1" y="1" width="1198" height="128" fill="none" stroke="#171717"/>
  <rect width="112" height="130" fill="#ff4d3d"/>
  <text x="56" y="87" text-anchor="middle" fill="#171717" font-size="62" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">01</text>
  <text x="150" y="40" fill="#6f6b63" font-size="17" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FIRST SUCCESSFUL ACTION</text>
  <text x="150" y="91" fill="#171717" font-size="48" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">RUN IT</text>
  <rect x="620" y="26" width="540" height="78" fill="#171717"/>
  <text x="644" y="58" fill="#aaa69d" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ cargo install --git …/shleder/vetto --locked</text>
  <text x="644" y="86" fill="#f4f1e8" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ vetto -- agent command</text>
  <rect x="926" y="69" width="9" height="21" fill="#ff4d3d"/>
</svg>
