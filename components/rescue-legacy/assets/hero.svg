<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#d29922" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="220" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Brand Accent Bar -->
  <rect x="0" y="0" width="800" height="4" fill="url(#brand-grad)"/>

  <!-- Icon: Rescue Shield + Terminal Pulse -->
  <g transform="translate(48, 48)">
    <path d="M 40 4 L 72 18 V 46 C 72 68 56 86 40 94 C 24 86 8 68 8 46 V 18 Z" fill="url(#shield-grad)" opacity="0.9"/>
    <!-- Terminal Check Mark & Pulse inside Shield -->
    <path d="M 26 48 L 36 58 L 56 36" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Title -->
  <text x="140" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">Codex Rescue</text>

  <!-- Alpha Badge -->
  <rect x="375" y="60" width="105" height="26" rx="13" fill="#238636" fill-opacity="0.2" stroke="#2ea043" stroke-width="1"/>
  <text x="427" y="77" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3fb950" text-anchor="middle">v0.1.0-alpha.2</text>

  <!-- Subtitle / Value Proposition -->
  <text x="140" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#8b949e">Local-first crash recovery &amp; evidence-backed salvage for OpenAI Codex sessions</text>

  <!-- Confidence Semantic Badges -->
  <g transform="translate(140, 148)">
    <!-- VERIFIED -->
    <rect x="0" y="0" width="105" height="24" rx="6" fill="#238636" fill-opacity="0.15" stroke="#2ea043" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#3fb950"/>
    <text x="24" y="16" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#3fb950">VERIFIED</text>

    <!-- RECONSTRUCTED -->
    <rect x="120" y="0" width="145" height="24" rx="6" fill="#9e6a03" fill-opacity="0.15" stroke="#d29922" stroke-width="1"/>
    <circle cx="134" cy="12" r="4" fill="#d29922"/>
    <text x="144" y="16" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#d29922">RECONSTRUCTED</text>

    <!-- UNKNOWN -->
    <rect x="280" y="0" width="105" height="24" rx="6" fill="#6e7681" fill-opacity="0.15" stroke="#8b949e" stroke-width="1"/>
    <circle cx="294" cy="12" r="4" fill="#8b949e"/>
    <text x="304" y="16" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#8b949e">UNKNOWN</text>
  </g>
</svg>
