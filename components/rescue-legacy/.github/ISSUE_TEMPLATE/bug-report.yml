name: Bug Report
description: Report a bug in Codex Rescue
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: rescue-version
    attributes:
      label: Codex Rescue version
      description: Output of `codex-rescue --version`
      placeholder: "0.1.0a2"
    validations:
      required: true

  - type: input
    id: codex-version
    attributes:
      label: Codex CLI version
      placeholder: "0.147.0"

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - pipx
        - pip
        - Source checkout
        - Other
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version` or `python3 --version`
      placeholder: "Python 3.12.3"

  - type: input
    id: git-version
    attributes:
      label: Git version
      description: Output of `git --version`
      placeholder: "git version 2.43.0"

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command that triggered the bug
      placeholder: "codex-rescue doctor --latest"
    validations:
      required: true

  - type: input
    id: exit-code
    attributes:
      label: Exit code
      description: Numeric exit code for the command, if it completed
      placeholder: "3"

  - type: dropdown
    id: codex-home-mode
    attributes:
      label: Codex home
      description: Which Codex home did Rescue inspect?
      options:
        - Default Codex home
        - Custom path via --codex-home
        - Unknown
    validations:
      required: true

  - type: textarea
    id: sessions-output
    attributes:
      label: Sanitized sessions output
      description: Output of `codex-rescue sessions --json`; remove absolute paths, prompts, and session identifiers.
      render: json

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove secrets, credentials, private prompts, and absolute home paths before pasting.
      render: text

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction steps
      description: |
        Do NOT include raw Codex rollout files, SQLite databases, credentials,
        private prompts, or unredacted absolute paths. Attach only sanitized
        diagnostics or a minimal synthetic fixture.
