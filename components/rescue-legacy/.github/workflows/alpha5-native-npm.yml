name: Alpha5 Native and NPM

on:
  push:
    branches: [feat/alpha5-complete]
  pull_request:
    branches: [feat/alpha5-complete]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha5-native-npm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke-pack:
    name: ${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_id: linux-x64
            platform_package: codex-rescue-linux-x64
            binary: codex-rescue
          - os: windows-latest
            platform_id: win32-x64
            platform_package: codex-rescue-win32-x64
            binary: codex-rescue.exe
          - os: macos-15
            platform_id: darwin-arm64
            platform_package: codex-rescue-darwin-arm64
            binary: codex-rescue
          - os: macos-15-intel
            platform_id: darwin-x64
            platform_package: codex-rescue-darwin-x64
            binary: codex-rescue

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install package and freezer
        run: python -m pip install . "pyinstaller==6.22.1"

      - name: Static npm security tests
        run: node --test npm/tests/*.test.cjs

      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm --onefile --name codex-rescue scripts/native_entry.py

      - name: Smoke native executable and compare Python JSON semantics
        run: python scripts/semantic_parity.py --native "dist/${{ matrix.binary }}" --output-dir build/parity

      - name: Native version and help
        run: |
          "dist/${{ matrix.binary }}" --version
          "dist/${{ matrix.binary }}" --help
        shell: bash
        if: runner.os != 'Windows'

      - name: Native version and help (Windows)
        run: |
          & "dist/${{ matrix.binary }}" --version
          & "dist/${{ matrix.binary }}" --help
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Record native SHA256
        run: python scripts/hash_file.py "dist/${{ matrix.binary }}" --output "build/${{ matrix.platform_id }}.sha256"

      - name: Assemble platform npm package
        run: python scripts/assemble_npm_platform.py --template "npm/platforms/${{ matrix.platform_id }}" --binary "dist/${{ matrix.binary }}" --output build/npm-platform

      - name: Prepare tarball directory
        run: python -c "from pathlib import Path; Path('build/tarballs').mkdir(parents=True, exist_ok=True)"

      - name: Pack platform npm package
        working-directory: build/npm-platform
        run: npm pack --pack-destination ../tarballs

      - name: Pack top-level npm package
        working-directory: npm/codex-rescue
        run: npm pack --pack-destination ../../build/tarballs

      - name: Audit npm tarball contents
        run: |
          python scripts/audit_npm_tarball.py "build/tarballs/${{ matrix.platform_package }}-0.1.0-alpha.5.tgz" --kind platform
          python scripts/audit_npm_tarball.py "build/tarballs/codex-rescue-0.1.0-alpha.5.tgz" --kind top

      - name: Prepare local npm smoke project
        run: python scripts/prepare_npm_smoke.py

      - name: Install local npm tarballs with lifecycle scripts disabled
        working-directory: build/npm-smoke
        run: npm install --ignore-scripts "../tarballs/${{ matrix.platform_package }}-0.1.0-alpha.5.tgz" "../tarballs/codex-rescue-0.1.0-alpha.5.tgz"

      - name: Smoke npm wrapper version and help
        working-directory: build/npm-smoke
        run: |
          node node_modules/codex-rescue/bin/codex-rescue.js --version
          node node_modules/codex-rescue/bin/codex-rescue.js --help

      - name: Compare npm wrapper JSON semantics
        run: python scripts/semantic_parity.py --native "dist/${{ matrix.binary }}" --node-launcher build/npm-smoke/node_modules/codex-rescue/bin/codex-rescue.js --output-dir build/parity

      - name: Upload native and npm qualification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alpha5-${{ matrix.platform_id }}
          path: |
            dist/${{ matrix.binary }}
            build/${{ matrix.platform_id }}.sha256
            build/tarballs/*.tgz
            build/parity/*.json
          if-no-files-found: error

  package-security:
    name: npm package security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: No runtime downloader, Python bootstrap, shell execution, lifecycle installer, or package over-inclusion
        run: node --test npm/tests/*.test.cjs
