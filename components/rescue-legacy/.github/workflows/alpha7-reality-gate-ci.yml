name: Alpha7 Reality Gate CI

on:
  push:
    branches: [alpha7-lab, main]
  pull_request:
    branches: [alpha7-lab, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha7-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reality-gate:
    name: Alpha7 Qualification (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Python Compileall
        run: |
          python -m compileall -q src tests scripts
        env:
          PYTHONPATH: src

      - name: Main Python Test Suite
        run: |
          python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

      - name: Alpha7 Laboratory Test Suite
        run: |
          python -m unittest discover -s tests/alpha7 -v
        env:
          PYTHONPATH: src

      - name: NPM Launcher and Package Tests
        working-directory: npm
        run: |
          node --test

      - name: Build Wheel and Source Distribution
        run: |
          python -m build

      - name: Test Wheel Installation in Clean Venv
        run: |
          python -c "
          import subprocess, tempfile, sys, os
          from pathlib import Path

          with tempfile.TemporaryDirectory() as td:
              venv_dir = Path(td) / 'test_env'
              subprocess.run([sys.executable, '-m', 'venv', str(venv_dir)], check=True)
              
              if os.name == 'nt':
                  py_bin = venv_dir / 'Scripts' / 'python.exe'
                  cli_bin = venv_dir / 'Scripts' / 'codex-rescue.exe'
              else:
                  py_bin = venv_dir / 'bin' / 'python'
                  cli_bin = venv_dir / 'bin' / 'codex-rescue'

              whl_files = list(Path('dist').glob('*.whl'))
              if not whl_files:
                  raise RuntimeError('No wheel built')
              whl_file = whl_files[0]
              print('Installing wheel:', whl_file)
              subprocess.run([str(py_bin), '-m', 'pip', 'install', str(whl_file.resolve())], check=True)
              
              print('Testing CLI binary help...')
              res = subprocess.run([str(cli_bin), '--help'], capture_output=True, text=True, check=True)
              print('CLI help header:', res.stdout.splitlines()[0])
              
              print('Testing CLI self-test in clean venv...')
              res_st = subprocess.run([str(cli_bin), 'self-test', '--json'], capture_output=True, text=True, check=True)
              print('Self-test exit code:', res_st.returncode)
          "

