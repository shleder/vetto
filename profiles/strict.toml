# vetto policy profile: strict
# Minimal surface. No dependency caches, no git identity, no /tmp writes.
# /dev/null + /dev/urandom stay available: redirect sinks and crypto
# entropy sources are required for any non-trivial agent to function.

[filesystem]
allow_write = ["$PROJECT", "/dev/null"]

allow_read = [
  "/usr", "/bin", "/sbin", "/lib", "/lib64",
  "/dev/null", "/dev/zero", "/dev/urandom", "/dev/random",
  "/etc/ld.so.cache", "/etc/ssl", "/etc/ca-certificates", "/etc/pki",
  "/etc/hosts",
]

[display_only_deny]
paths = [
  "$HOME/.ssh", "$HOME/.aws", "$HOME/.gnupg",
  "$HOME/.npmrc", "$HOME/.git-credentials", "$HOME/.netrc",
  "$HOME/.config/gcloud", "$HOME/.kube",
  "$HOME/.gitconfig",
  "$PROJECT/.env", "$PROJECT/**/.env*",
  "$PROJECT/**/*.pem", "$PROJECT/**/*.key", "$PROJECT/**/*.p12",
]
