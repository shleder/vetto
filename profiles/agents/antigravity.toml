[metadata]
name = "antigravity"
description = "Compatibility profile for Google Antigravity (agy) agent."

[filesystem]
allow_read = [
    "$HOME/.config/Antigravity",
    "$HOME/.gemini",
    "$AGENT",
]
allow_write = [
    "$HOME/.config/Antigravity",
    "$HOME/.gemini",
    "$AGENT",
]

[environment]
pass_through = [
    "ANTIGRAVITY_*",
    "AGY_*",
    "GEMINI_API_KEY",
    "GOOGLE_API_KEY",
]

[display_only_deny]
paths = [
    "$AGENT/*.sock",
    "$AGENT/*.ipc",
]
