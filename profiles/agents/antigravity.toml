[metadata]
name = "antigravity"
description = "Compatibility profile for Google Antigravity (agy) agent."

[filesystem]
allow_read = [
    "$HOME/.config/Antigravity",
    "$HOME/.gemini",
    "$HOME/.gemini/antigravity/plugins",
    "$HOME/.gemini/config/plugins",
    "$HOME/.gemini/config/skills",
    "$AGENT",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "/run/user",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_write = [
    "$HOME/.config/Antigravity",
    "$HOME/.gemini",
    "$HOME/.gemini/antigravity/plugins",
    "$HOME/.gemini/config/plugins",
    "$HOME/.gemini/config/skills",
    "$AGENT",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "ANTIGRAVITY_*",
    "AGY_*",
    "GEMINI_API_KEY",
    "GOOGLE_API_KEY",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]
