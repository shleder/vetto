[metadata]
name = "antigravity"
description = "Compatibility profile for Google Antigravity (agy) agent."

[filesystem]
allow_read = [
    "$HOME/.config/Antigravity",
    "$HOME/.gemini",
    "$AGENT",
    "/run/user",
]
allow_write = [
    "$HOME/.config/Antigravity",
    "$HOME/.gemini",
    "$AGENT",
]

[environment]
pass_through = [
    "ANTIGRAVITY_*",
    "AGY_*",
    "GEMINI_API_KEY",
    "GOOGLE_API_KEY",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
]

[display_only_deny]
paths = [
    "$AGENT/*.sock",
    "$AGENT/*.ipc",
]
