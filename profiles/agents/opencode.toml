[metadata]
name = "opencode"
description = "Safe compatibility roots for OpenCode CLI."

[filesystem]
allow_write = [
  "$HOME/.config/opencode",
  "$HOME/.local/share/opencode",
  "$HOME/.opencode",
  "$AGENT",
]
allow_read = [
  "$HOME/.config/opencode",
  "$HOME/.local/share/opencode",
  "$HOME/.opencode",
  "$HOME/.local/bin",
  "$AGENT",
]

[environment]
pass_through = [
  "OPENCODE_*",
  "OPENAI_API_KEY",
  "OPENAI_BASE_URL",
  "ANTHROPIC_API_KEY",
  "ANTHROPIC_BASE_URL",
  "OPENROUTER_API_KEY",
]

[display_only_deny]
paths = [
  "$AGENT/*.sock",
  "$AGENT/*.ipc",
]
