[metadata]
name = "opencode"
description = "Safe compatibility roots for OpenCode agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.config/opencode",
    "$HOME/.config/opencode/plugins",
    "$HOME/.local/share/opencode",
    "$HOME/.local/share/opencode/plugins",
    "$HOME/.local/state/opencode",
    "$HOME/.opencode",
    "$HOME/.opencode/plugins",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "/",
]
allow_write = [
    "$AGENT",
    "$HOME/.config/opencode",
    "$HOME/.config/opencode/plugins",
    "$HOME/.local/share/opencode",
    "$HOME/.local/share/opencode/plugins",
    "$HOME/.local/state/opencode",
    "$HOME/.opencode",
    "$HOME/.opencode/plugins",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "/tmp",
]

[environment]
pass_through = [
    "OPENCODE_*",
    "OPENAI_API_KEY",
    "OPENAI_BASE_URL",
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_BASE_URL",
    "OPENROUTER_API_KEY",
    "OPENROUTER_BASE_URL",
    "NVIDIA_API_KEY",
    "NVIDIA_BASE_URL",
    "AIHUBMIX_API_KEY",
    "AIHUBMIX_BASE_URL",
    "AGENTROUTER_API_KEY",
    "AGENTROUTER_BASE_URL",
    "OPEASI_API_KEY",
    "OPEASI_BASE_URL",
    "GEMINI_API_KEY",
    "GROQ_API_KEY",
    "DEEPSEEK_API_KEY",
    "MISTRAL_API_KEY",
    "TOGETHER_API_KEY",
    "XDG_DATA_HOME",
    "BUN_*",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]

[limits]
file_size_bytes = 2147483648

[network]
allow = [
    "api.openai.com",
    "api.anthropic.com",
    "openrouter.ai",
    "opencode.ai",
    "integrate.api.nvidia.com",
    "agentrouter.org",
    "aihubmix.com",
    "api.github.com",
    "github.com",
    "localhost",
    "127.0.0.1",
    "registry.npmjs.org",
    "pypi.org",
    "files.pythonhosted.org",
]
