[metadata]
name = "opencode"
description = "Safe compatibility roots for OpenCode agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.opencode",
    "$HOME/.bun",
    "$HOME/.cache",
    "/",
]
allow_write = [
    "$AGENT",
    "$HOME/.opencode",
    "$HOME/.bun",
    "$HOME/.cache",
    "/tmp",
]

[environment]
pass_through = [
    "OPENCODE_*",
    "OPENAI_API_KEY",
    "ANTHROPIC_API_KEY",
    "OPENROUTER_API_KEY",
]

[display_only_deny]
paths = [
    "$AGENT/*.sock",
    "$AGENT/*.ipc",
]

[limits]
file_size_bytes = 2147483648

[network]
allow = [
    "api.openai.com",
    "api.anthropic.com",
    "openrouter.ai",
    "opencode.ai",
    "api.github.com",
    "github.com",
]
