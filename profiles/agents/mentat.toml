[metadata]
name = "mentat"
description = "Compatibility profile for Mentat coding assistant."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.mentat",
    "$HOME/.mentat/plugins",
    "$HOME/.mentat/skills",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
]
allow_write = [
    "$AGENT",
    "$HOME/.mentat",
    "$HOME/.mentat/plugins",
    "$HOME/.mentat/skills",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
]

[environment]
pass_through = [
    "MENTAT_*",
    "OPENAI_API_KEY",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]
