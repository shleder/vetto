[metadata]
name = "cline"
description = "Compatibility profile for Cline (Claude Dev) extension agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.cline",
    "$HOME/.config/Code",
    "$HOME/.config/Code/User/globalStorage/saoudrizwan.claude-dev",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
    "$HOME/.cache",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "/",
]
allow_write = [
    "$AGENT",
    "$HOME/.cline",
    "$HOME/.config/Code",
    "$HOME/.config/Code/User/globalStorage/saoudrizwan.claude-dev",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
    "$HOME/.cache",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "/tmp",
]

[environment]
pass_through = [
    "CLINE_*",
    "ANTHROPIC_API_KEY",
    "OPENROUTER_API_KEY",
]

[network]
allow = [
    "api.anthropic.com",
    "api.openai.com",
    "openrouter.ai",
    "otel.cline.bot",
    "api.cline.bot",
    "data.cline.bot",
    "registry.npmjs.org",
    "pypi.org",
    "files.pythonhosted.org",
]
