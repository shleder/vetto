[metadata]
name = "cline"
description = "Compatibility profile for Cline (Claude Dev) extension agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.config/Code/User/globalStorage/saoudrizwan.claude-dev",
]
allow_write = [
    "$AGENT",
    "$HOME/.config/Code/User/globalStorage/saoudrizwan.claude-dev",
]

[environment]
pass_through = [
    "CLINE_*",
    "ANTHROPIC_API_KEY",
    "OPENROUTER_API_KEY",
]

[display_only_deny]
paths = [
    "$AGENT/*.sock",
]
