[metadata]
name = "codex"
description = "Hardened compatibility roots for OpenAI Codex CLI."

[filesystem]
allow_write = [
    "$AGENT",
    "/tmp",
    "$HOME/.cache",
]
allow_read = [
    "$AGENT",
    "/tmp",
    "$HOME/.cache",
]

[environment]
pass_through = [
    "OPENAI_API_KEY",
    "OPENAI_BASE_URL",
    "CODEX_*",
    "DISPLAY",
    "WAYLAND_DISPLAY",
]
