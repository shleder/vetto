[metadata]
name = "codex"
description = "Hardened compatibility roots for OpenAI Codex CLI."

[filesystem]
allow_write = [
    "$AGENT",
    "$HOME/.config/codex",
    "$HOME/.codex/plugins",
    "$HOME/.codex/skills",
    "$HOME/.local/share/codex",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_read = [
    "$AGENT",
    "$HOME/.config/codex",
    "$HOME/.codex/plugins",
    "$HOME/.codex/skills",
    "$HOME/.local/share/codex",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "OPENAI_API_KEY",
    "OPENAI_BASE_URL",
    "CODEX_*",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]
