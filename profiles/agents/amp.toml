[metadata]
name = "amp"
description = "Compatibility profile for Amp agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.amp",
    "$HOME/.amp/plugins",
    "$HOME/.amp/skills",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
]
allow_write = [
    "$AGENT",
    "$HOME/.amp",
    "$HOME/.amp/plugins",
    "$HOME/.amp/skills",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
]

[environment]
pass_through = [
    "AMP_*",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]
