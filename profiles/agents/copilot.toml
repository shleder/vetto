[metadata]
name = "copilot"
description = "Compatibility profile for GitHub Copilot CLI."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.config/github-copilot",
]
allow_write = [
    "$AGENT",
    "$HOME/.config/github-copilot",
]

[environment]
pass_through = [
    "COPILOT_*",
    "GH_TOKEN",
    "GITHUB_TOKEN",
]
