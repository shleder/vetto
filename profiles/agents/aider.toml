[metadata]
name = "aider"
description = "Hardened compatibility roots for Aider pair programmer."

[filesystem]
allow_read = [
    "$HOME/.aider.conf.yml",
    "$AGENT",
    "$PROJECT/.aider.chat.history.md",
    "/tmp",
    "$HOME/.cache",
]
allow_write = [
    "$AGENT",
    "$PROJECT/.aider.chat.history.md",
    "/tmp",
    "$HOME/.cache",
]

[environment]
pass_through = [
    "AIDER_*",
    "OPENAI_API_KEY",
    "OPENAI_BASE_URL",
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_BASE_URL",
    "OPENROUTER_API_KEY",
    "OPENROUTER_BASE_URL",
    "GEMINI_API_KEY",
    "DEEPSEEK_API_KEY",
    "GROQ_API_KEY",
]
