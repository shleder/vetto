[metadata]
name = "aider"
description = "Safe compatibility roots for Aider."

[filesystem]
allow_read = [
    "$HOME/.aider.conf.yml",
    "$AGENT",
]
allow_write = [
    "$AGENT",
]

[environment]
pass_through = [
    "AIDER_*",
    "OPENAI_API_KEY",
    "OPENAI_BASE_URL",
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_BASE_URL",
    "OPENROUTER_API_KEY",
    "OPENROUTER_BASE_URL",
    "GEMINI_API_KEY",
    "DEEPSEEK_API_KEY",
    "GROQ_API_KEY",
]

[display_only_deny]
paths = [
    "$AGENT/*.sock",
    "$AGENT/*.ipc",
]
