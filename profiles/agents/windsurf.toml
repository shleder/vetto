[metadata]
name = "windsurf"
description = "Compatibility profile for Windsurf (Codeium) editor agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.codeium",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_write = [
    "$AGENT",
    "$HOME/.codeium",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "WINDSURF_*",
    "CODEIUM_*",
]
