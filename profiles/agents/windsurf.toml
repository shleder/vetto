[metadata]
name = "windsurf"
description = "Compatibility profile for Windsurf (Codeium) editor agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.codeium",
    "$HOME/.codeium/plugins",
    "$HOME/.windsurf/plugins",
    "$HOME/.windsurf/skills",
    "$HOME/.config/windsurf",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_write = [
    "$AGENT",
    "$HOME/.codeium",
    "$HOME/.codeium/plugins",
    "$HOME/.windsurf/plugins",
    "$HOME/.windsurf/skills",
    "$HOME/.config/windsurf",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "WINDSURF_*",
    "CODEIUM_*",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]
