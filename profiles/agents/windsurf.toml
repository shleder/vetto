[metadata]
name = "windsurf"
description = "Compatibility profile for Windsurf (Codeium) editor agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.codeium",
]
allow_write = [
    "$AGENT",
    "$HOME/.codeium",
]

[environment]
pass_through = [
    "WINDSURF_*",
    "CODEIUM_*",
]

[display_only_deny]
paths = [
    "$AGENT/*.sock",
]
