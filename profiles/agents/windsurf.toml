[metadata]
name = "windsurf"
description = "Compatibility profile for Windsurf (Codeium) editor agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.codeium",
    "/tmp",
    "$HOME/.cache",
]
allow_write = [
    "$AGENT",
    "$HOME/.codeium",
    "/tmp",
    "$HOME/.cache",
]

[environment]
pass_through = [
    "WINDSURF_*",
    "CODEIUM_*",
]
