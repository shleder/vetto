[metadata]
name = "goose"
description = "Compatibility profile for Block Goose agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.config/goose",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_write = [
    "$AGENT",
    "$HOME/.config/goose",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "GOOSE_*",
    "OPENAI_API_KEY",
    "ANTHROPIC_API_KEY",
]
