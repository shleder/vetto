[metadata]
name = "goose"
description = "Compatibility profile for Block Goose agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.config/goose",
]
allow_write = [
    "$AGENT",
    "$HOME/.config/goose",
]

[environment]
pass_through = [
    "GOOSE_*",
    "OPENAI_API_KEY",
    "ANTHROPIC_API_KEY",
]

[display_only_deny]
paths = [
    "$AGENT/*.sock",
]
