[metadata]
name = "goose"
description = "Compatibility profile for Block Goose agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.config/goose",
    "/tmp",
    "$HOME/.cache",
]
allow_write = [
    "$AGENT",
    "$HOME/.config/goose",
    "/tmp",
    "$HOME/.cache",
]

[environment]
pass_through = [
    "GOOSE_*",
    "OPENAI_API_KEY",
    "ANTHROPIC_API_KEY",
]
