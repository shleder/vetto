[metadata]
name = "claude"
description = "Hardened compatibility roots for Claude Code CLI."

[filesystem]
allow_write = [
    "$HOME/.claude.json",
    "$AGENT",
    "$HOME/.claude/plugins",
    "$HOME/.claude/skills",
    "$HOME/.config/claude",
    "$HOME/.config/claude-code",
    "$HOME/.local/share/claude",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_read = [
    "$HOME/.claude.json",
    "$AGENT",
    "$HOME/.claude/plugins",
    "$HOME/.claude/skills",
    "$HOME/.config/claude",
    "$HOME/.config/claude-code",
    "$HOME/.local/share/claude",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_BASE_URL",
    "CLAUDE_*",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]
