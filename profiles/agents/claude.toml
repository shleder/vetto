[metadata]
name = "claude"
description = "Hardened compatibility roots for Claude Code CLI."

[filesystem]
allow_write = [
    "$HOME/.claude.json",
    "$AGENT",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_read = [
    "$HOME/.claude.json",
    "$AGENT",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_BASE_URL",
    "CLAUDE_*",
    "DISPLAY",
    "WAYLAND_DISPLAY",
]
