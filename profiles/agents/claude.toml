[metadata]
name = "claude"
description = "Safe compatibility roots for Claude Code."

[filesystem]
allow_write = [
    "$HOME/.claude.json",
    "$AGENT",
]
allow_read = [
    "$HOME/.claude.json",
    "$AGENT",
]

[environment]
pass_through = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_BASE_URL",
    "CLAUDE_*",
]

[display_only_deny]
paths = [
    "$AGENT/*.sock",
    "$AGENT/*.ipc",
]
