[metadata]
name = "openhands"
description = "Compatibility profile for OpenHands (OpenDevin) agent."

[filesystem]
allow_read = ["$AGENT"]
allow_write = ["$AGENT"]

[environment]
pass_through = [
    "OPENHANDS_*",
    "OPENAI_API_KEY",
    "ANTHROPIC_API_KEY",
]

[display_only_deny]
paths = [
    "$AGENT/*.sock",
]
