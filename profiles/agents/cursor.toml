[metadata]
name = "cursor"
description = "Compatibility profile for Cursor editor agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.config/Cursor",
    "/run/user",
    "/tmp",
    "$HOME/.cache",
]
allow_write = [
    "$AGENT",
    "$HOME/.config/Cursor",
    "/tmp",
    "$HOME/.cache",
]

[environment]
pass_through = [
    "CURSOR_*",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
]
