[metadata]
name = "cursor"
description = "Compatibility profile for Cursor editor agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.config/Cursor",
    "$HOME/.config/Cursor/User",
    "$HOME/.cursor/extensions",
    "$HOME/.cursor/plugins",
    "$HOME/.cursor/skills",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "/run/user",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_write = [
    "$AGENT",
    "$HOME/.config/Cursor",
    "$HOME/.config/Cursor/User",
    "$HOME/.cursor/extensions",
    "$HOME/.cursor/plugins",
    "$HOME/.cursor/skills",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "CURSOR_*",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]
