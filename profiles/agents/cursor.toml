[metadata]
name = "cursor"
description = "Compatibility profile for Cursor editor agent."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.config/Cursor",
]
allow_write = [
    "$AGENT",
    "$HOME/.config/Cursor",
]

[environment]
pass_through = [
    "CURSOR_*",
]

[display_only_deny]
paths = [
    "$AGENT/*.sock",
    "$AGENT/*.ipc",
]
