[metadata]
name = "gpt_engineer"
description = "Compatibility profile for GPT-Engineer CLI."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.gpt_engineer",
    "$HOME/.gpt_engineer/plugins",
    "$HOME/.gpt_engineer/skills",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
]
allow_write = [
    "$AGENT",
    "$HOME/.gpt_engineer",
    "$HOME/.gpt_engineer/plugins",
    "$HOME/.gpt_engineer/skills",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
]

[environment]
pass_through = [
    "OPENAI_API_KEY",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]
