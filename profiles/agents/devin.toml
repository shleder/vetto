[metadata]
name = "devin"
description = "Compatibility profile for Devin CLI environment."

[filesystem]
allow_read = [
    "$AGENT",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_write = [
    "$AGENT",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "DEVIN_*",
]
