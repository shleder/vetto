[metadata]
name = "continue"
description = "Compatibility profile for Continue.dev extension."

[filesystem]
allow_read = [
    "$AGENT",
    "$HOME/.continue",
    "$HOME/.continue/plugins",
    "$HOME/.continue/skills",
    "$HOME/.local/bin",
    "$HOME/.cargo/bin",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
]
allow_write = [
    "$AGENT",
    "$HOME/.continue",
    "$HOME/.continue/plugins",
    "$HOME/.continue/skills",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.cache/ms-playwright",
    "$HOME/.cache/puppeteer",
]

[environment]
pass_through = [
    "CONTINUE_*",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_TYPE",
    "XDG_SESSION_DESKTOP",
    "XAUTHORITY",
    "DBUS_SESSION_BUS_ADDRESS",
    "BROWSER",
    "XDG_RUNTIME_DIR",
]
