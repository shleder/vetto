[metadata]
name = "gemini"
description = "Safe compatibility roots for Gemini CLI."

[filesystem]
allow_read = [
    "$AGENT",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]
allow_write = [
    "$AGENT",
    "/tmp",
    "$HOME/.cache",
    "$HOME/.npm",
    "$HOME/.npm/_npx",
    "$HOME/.cache/uv",
    "$HOME/.local/share/uv",
    "$HOME/.bun",
    "$HOME/.bun/install/cache",
]

[environment]
pass_through = [
    "GEMINI_API_KEY",
    "GOOGLE_API_KEY",
    "GEMINI_*",
]
