[metadata]
name = "gemini"
description = "Safe compatibility roots for Gemini CLI."

[filesystem]
allow_read = [
    "$AGENT",
    "/tmp",
    "$HOME/.cache",
]
allow_write = [
    "$AGENT",
    "/tmp",
    "$HOME/.cache",
]

[environment]
pass_through = [
    "GEMINI_API_KEY",
    "GOOGLE_API_KEY",
    "GEMINI_*",
]
