[metadata]
name = "gemini"
description = "Safe compatibility roots for Gemini CLI."

[filesystem]
allow_read = ["$AGENT"]
allow_write = ["$AGENT"]

[environment]
pass_through = [
    "GEMINI_API_KEY",
    "GOOGLE_API_KEY",
    "GEMINI_*",
]

[display_only_deny]
paths = [
    "$AGENT/*.sock",
    "$AGENT/*.ipc",
]
